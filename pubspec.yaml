name: context_collector
description: A desktop app for collecting and combining text from multiple files.
publish_to: 'none'
version: 3.3.0+8

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.32.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_monaco:
    git:
      url: https://github.com/omar-hanafy/flutter_monaco.git
      ref: fix-#11
  flutter_directory_tree: ^1.0.0
  directory_tree: ^1.0.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  freezed: ^3.2.0
  freezed_annotation: ^3.1.0
  tiktoken: ^1.0.3
  json_annotation: ^4.9.0
  desktop_drop:
    git:
      url: https://github.com/omar-hanafy/flutter-plugins.git
      path: packages/desktop_drop
  file_selector: ^1.1.0
  window_manager: ^0.5.1
  flutter_helper_utils: ^8.5.0
  resizable_splitter: ^1.1.0
  dart_helper_utils: ^5.4.1
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  file_picker: ^10.3.7
  diff_match_patch: ^0.4.1
  flutter_svg: ^2.2.3
  synchronized: ^3.4.0
  enefty_icons: ^1.0.9
  equatable: ^2.0.7
  # Cross-platform WebView dependencies
  webview_flutter: ^4.13.0        # For macOS, iOS, Android
  webview_windows:
    git:
      url: https://github.com/omar-hanafy/flutter-webview-windows.git
      ref: main
  auto_updater: ^1.0.0
  package_info_plus: ^9.0.0
  archive: ^4.0.9
  xml: ^7.0.1
  collection: ^1.19.1
  cross_file: any
  uuid: ^4.5.2
  docx_to_markdown: ^0.1.0

dependency_overrides:
  # docx_to_markdown 0.1.0 requires meta ^1.18.3, while Flutter pins
  # meta 1.18.0. The converter does not use APIs added after 1.18.0.
  meta: 1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  msix: ^3.16.12
  very_good_analysis: ^10.0.0
  build_runner: ^2.8.0

flutter:
  uses-material-design: true
  assets:
    # top-level bundles you were already exposing
    - assets/

    # Buy Me a Coffee assets
    - assets/buymeacoffe/


msix_config:
  # Displayed product name in Start menu and Store
  display_name: Context Collector

  # Must match Package/Identity/Name from Partner Center
  identity_name: OmarHanafy.58591FADF4E9E

  # Shown in the Store as the publisher name
  publisher_display_name: Omar Hanafy

  # Store requires revision=0; keep 4-part, monotonic. Next releases: 3.0.1.0, 3.0.2.0, ...
  msix_version: 3.2.0.0

  # Use original high-res source so MSIX can downscale cleanly
  logo_path: icons/ContextCollector.png
  # Keep original bounds when resizing tiles to avoid edge cropping
  trim_logo: false

  # Windows capabilities required by the app
  capabilities: internetClient

  # Languages included in this package
  languages: en-us

  # Generate a package intended for Microsoft Store submission
  store: true

  # Must match Package/Identity/Publisher (CN=...)
  publisher: "CN=682B2A9C-1AF5-466C-AD40-B171147739EA"
