name: context_collector
description: A desktop app for collecting and combining text from multiple files.
publish_to: 'none'
version: 3.0.0+4

environment:
  sdk: '>=3.8.1 <4.0.0'
  flutter: '>=3.32.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_monaco:
    path: ../../Development/MyProjects/flutter_monaco
  ai_token_calculator:
    path: ./packages/ai_token_calculator
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  freezed: ^3.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  desktop_drop:
    path: ../../Development/MyProjects/flutter-plugins/packages/desktop_drop
  file_selector: ^1.0.3
  window_manager: ^0.5.1
  flutter_helper_utils: ^8.3.0
  dart_helper_utils: ^5.4.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  file_picker: ^10.3.3
  diff_match_patch: ^0.4.1
  flutter_svg: ^2.2.1
  synchronized: ^3.4.0
  enefty_icons: ^1.0.8
  equatable: ^2.0.7
  # Cross-platform WebView dependencies
  webview_flutter: ^4.13.0        # For macOS, iOS, Android
  webview_windows: ^0.4.0         # For Windows (keep your existing version)
  auto_updater: ^1.0.0
  package_info_plus: ^9.0.0
  archive: ^4.0.7
  xml: ^6.6.1
  collection: ^1.19.1
  cross_file: any
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  msix: ^3.16.12
  very_good_analysis: ^9.0.0
  build_runner: ^2.6.0
  json_serializable: ^6.10.0
flutter:
  uses-material-design: true
  assets:
    # top-level bundles you were already exposing
    - assets/

    # Buy Me a Coffee assets
    - assets/buymeacoffe/


msix_config:
  display_name: ContextCollector
  identity_name: com.omarhanafy.context.collector
  publisher_display_name: Omar Hanafy
  msix_version: 1.0.0.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
